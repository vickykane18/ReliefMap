<!DOCTYPE html>
<html>
<head>
  <title>ReliefMap</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- GSAP for animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body {
      display: flex;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1b2735);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    #map { height: 100vh; width: 70%; }
    #sidebar {
      width: 30%; padding: 20px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      overflow-y: auto;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
    }
    h1 { text-align: center; color: #00c6ff; }
    input, select, button {
      width: 95%; padding: 10px; margin: 5px 0;
      border: none; border-radius: 6px;
    }
    button {
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white; cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #00c6ff;
    }
    ul { list-style: none; padding: 0; }
    li { margin: 5px 0; padding: 8px; background: rgba(255,255,255,0.1); cursor: pointer; border-radius: 5px; }
    li:hover { background: rgba(0,198,255,0.3); }
    #stats { margin-top: 20px; font-size: 14px; }
    .pulse {
      width: 20px; height: 20px;
      background: rgba(0,255,255,0.6);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <h1>ReliefMap</h1>
    <input type="text" id="search" placeholder="Search Centers...">
    <div id="filters">
      <button onclick="filterCenters('All')">All</button>
      <button onclick="filterCenters('Hospital')">Hospitals</button>
      <button onclick="filterCenters('Food')">Food</button>
      <button onclick="filterCenters('Shelter')">Shelters</button>
    </div>
    <h2>Relief Centers</h2>
    <ul id="centerList"></ul>

    <div id="stats"></div>

    <h2>Add New Relief Center</h2>
    <form id="centerForm">
      <input type="text" id="name" placeholder="Center Name" required>
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="Hospital">Hospital</option>
        <option value="Food">Food</option>
        <option value="Shelter">Shelter</option>
      </select>
      <input type="number" id="lat" placeholder="Latitude" step="0.0001" required>
      <input type="number" id="lng" placeholder="Longitude" step="0.0001" required>
      <button type="submit">Add Center</button>
    </form>
  </div>

  <script>
    var map = L.map('map').setView([13.0827, 80.2707], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    var markers = L.markerClusterGroup();
    map.addLayer(markers);

    let allCenters = [];

    function loadCenters() {
      fetch("http://127.0.0.1:5000/api/centers")
        .then(res => res.json())
        .then(data => {
          allCenters = data;
          updateUI(data);
        });
      fetch("http://127.0.0.1:5000/api/stats")
        .then(res => res.json())
        .then(stats => {
          document.getElementById("stats").innerHTML =
            `🏥 Hospitals: ${stats.Hospitals}<br>🍽️ Food: ${stats["Food Centers"]}<br>🏠 Shelters: ${stats.Shelters}`;
        });
    }

    function updateUI(data) {
      markers.clearLayers();
      const list = document.getElementById("centerList");
      list.innerHTML = "";
      data.forEach(center => {
        const iconHtml = '<div class="pulse"></div>';
        const marker = L.marker([center.lat, center.lng], { icon: L.divIcon({ html: iconHtml, className: 'animated-marker' }) })
          .bindPopup(`<b>${center.name}</b><br>Type: ${center.type}<br>Lat: ${center.lat}, Lng: ${center.lng}`);
        markers.addLayer(marker);

        const li = document.createElement("li");
        li.textContent = `${center.name} (${center.type})`;
        li.onclick = () => { map.setView([center.lat, center.lng], 14); marker.openPopup(); };
        list.appendChild(li);
      });
    }

    function filterCenters(type) {
      if (type === "All") updateUI(allCenters);
      else updateUI(allCenters.filter(c => c.type === type));
    }

    document.getElementById("search").addEventListener("input", e => {
      const q = e.target.value.toLowerCase();
      updateUI(allCenters.filter(c => c.name.toLowerCase().includes(q)));
    });

    document.getElementById("centerForm").addEventListener("submit", e => {
      e.preventDefault();
      const newCenter = {
        name: document.getElementById("name").value,
        type: document.getElementById("type").value,
        lat: parseFloat(document.getElementById("lat").value),
        lng: parseFloat(document.getElementById("lng").value)
      };
      fetch("http://127.0.0.1:5000/api/centers", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newCenter)
      }).then(() => loadCenters());
    });

    loadCenters();
    setInterval(loadCenters, 10000);
  </script>
</body>
</html>
