<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Offline | ReliefMap</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #0b1220;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .offline-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .offline-icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ef4444;
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.85; }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-top: 12px;
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .hint {
            margin-top: 26px;
            font-size: 13px;
            color: #64748b;
        }
    </style>

</head>

    <body>

    <div class="offline-card">

        <div class="offline-icon">
            <i class="fa-solid fa-wifi"></i>
        </div>

        <h1>You're Offline</h1>

        <span class="badge">🔴 Offline Mode</span>

        <p>
            ReliefMap is working offline. Your saved data and
            pending requests are stored safely on this device and
            will synchronize automatically when your connection returns.
        </p>

        <button class="btn" onclick="location.reload()">
            <i class="fa-solid fa-rotate"></i>
            Retry Connection
        </button>

        <button class="btn secondary" onclick="goHomeOffline()">
            <i class="fa-solid fa-house"></i>
            Back to Dashboard
        </button>

        <div class="hint">
            <i class="fa-solid fa-shield-heart"></i>
            ReliefMap • Offline-First
        </div>

    </div>

    <script>
        function goHomeOffline() {
            location.href = "index.html";
        }

        // Auto retry when back online
        window.addEventListener("online", () => {
            location.href = "index.html";
        });
    </script>

</body>

</html>
