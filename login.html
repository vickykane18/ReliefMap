<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | ReliefMap</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body class="login-body">

    <!-- Apply saved theme before first paint to avoid a light/dark flash -->
    <script>
        (function () {
            try {
                var raw = localStorage.getItem("relief_theme");
                var theme = raw ? JSON.parse(raw) : "dark";
                if (theme !== "light" && theme !== "dark") theme = "dark";
                document.body.classList.add(theme);
            } catch (e) {
                document.body.classList.add("dark");
            }
        })();
    </script>

    <div class="login-wrap">

<!-- Left panel -->
        <div class="login-brand animate-fade-left">

            <div class="brand-logo">
                <i class="fa-solid fa-shield-heart"></i>
            </div>

            <h1>ReliefMap</h1>

            <p>AI Powered Disaster Relief Coordination Platform</p>

            <div class="brand-stats">

                <div>
                    <strong>12+</strong>
                    <span>Hospitals</span>
                </div>

                <div>
                    <strong>8+</strong>
                    <span>Food Centers</span>
                </div>

                <div>
                    <strong>315+</strong>
                    <span>Volunteers</span>
                </div>

            </div>

            <div class="brand-features">

                <span><i class="fa-solid fa-brain"></i> AI Predictions</span>
                <span><i class="fa-solid fa-map-location-dot"></i> Live Map</span>
                <span><i class="fa-solid fa-bullhorn"></i> Rapid Alerts</span>

            </div>

        </div>

<!-- Right panel -->
        <div class="login-card animate-fade-right">

            <div class="login-head">

                <h2 id="formTitle">Citizen Login</h2>

                <p id="formSub">Report a disaster or request help</p>

            </div>

            <!-- Role toggle -->
            <div class="role-toggle">

                <button class="role-btn active"
                        data-role="Citizen"
                        data-title="Citizen Login"
                        data-sub="Report a disaster or request help">
                    <i class="fa-solid fa-user-group"></i>
                    <span>Citizen</span>
                </button>

                <button class="role-btn"
                        data-role="NGO"
                        data-title="NGO Login"
                        data-sub="Manage relief operations & missions">
                    <i class="fa-solid fa-truck-medical"></i>
                    <span>NGO</span>
                </button>

                <button class="role-btn"
                        data-role="Volunteer"
                        data-title="Volunteer Login"
                        data-sub="Track missions & deployments">
                    <i class="fa-solid fa-handshake-angle"></i>
                    <span>Volunteer</span>
                </button>

            </div>

            <!-- Tab switch -->
            <div class="tab-switch">

                <button class="tab-btn active"
                        data-tab="login">
                    Login
                </button>

                <button class="tab-btn"
                        data-tab="register">
                    Register
                </button>

            </div>

            <!-- Login form -->
            <form id="loginForm" class="auth-form">

                <div class="form-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email"
                           id="loginEmail"
                           placeholder="Email address"
                           required>
                </div>

                <div class="form-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password"
                           id="loginPassword"
                           placeholder="Password"
                           required>
                    <button type="button"
                            class="toggle-pass"
                            aria-label="Toggle password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <button type="submit"
                        class="auth-submit"
                        id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </button>

                <p class="auth-msg"
                   id="loginMsg"></p>

            </form>

            <!-- Register form -->
            <form id="registerForm"
                  class="auth-form hidden"
                  autocomplete="off">

                <div class="form-field">
                    <i class="fa-solid fa-user"></i>
                    <input type="text"
                           id="regName"
                           placeholder="Full name"
                           required>
                </div>

                <div class="form-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email"
                           id="regEmail"
                           placeholder="Email address"
                           required>
                </div>

                <div class="form-field">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel"
                           id="regPhone"
                           placeholder="Phone number">
                </div>

                <div class="form-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password"
                           id="regPassword"
                           placeholder="Password (min 6 chars)"
                           required>
                    <button type="button"
                            class="toggle-pass"
                            aria-label="Toggle password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <button type="submit"
                        class="auth-submit"
                        id="registerBtn">
                    <i class="fa-solid fa-user-plus"></i>
                    Create Account
                </button>

                <p class="auth-msg"
                   id="registerMsg"></p>

            </form>

            <p class="login-foot">
                <i class="fa-solid fa-shield-halved"></i>
                Secure • Role-based access • ReliefMap
            </p>

        </div>

    </div>

    <!-- Shared Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/roles.js"></script>

    <!-- Page Script -->
    <script src="js/login.js"></script>

</body>

</html>
